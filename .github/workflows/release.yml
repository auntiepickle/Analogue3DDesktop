name: release

# Builds standalone binaries with PyInstaller and attaches them to the GitHub
# Release whenever a version tag (vX.Y.Z) is pushed. Can also be run manually
# (workflow_dispatch) to produce build artifacts without releasing.
#
# Windows is the primary target (Edge WebView2 backend). macOS and Linux are
# best-effort: pywebview's native backends are heavier to bundle, so if a job
# fails the others still attach (fail-fast is off). The engine (analogue3d) is
# pulled from the public core repo at build time.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            asset: Analogue3DStudio-windows.exe
          - os: macos-latest
            label: macos
            asset: Analogue3DStudio-macos.zip
          - os: ubuntu-latest
            label: linux
            asset: Analogue3DStudio-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system deps (GTK/WebKit for pywebview)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libcairo2-dev pkg-config python3-dev

      - name: Install Python deps + engine
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "git+https://github.com/auntiepickle/Analogue3DUtility.git"
          case "${{ matrix.label }}" in
            windows) pip install pywebview pythonnet ;;
            macos)   pip install pywebview ;;
            linux)   pip install "pywebview[gtk]" PyGObject ;;
          esac

      - name: Build one-file binary
        run: python build.py

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.label }}" in
            windows) cp "dist/Analogue3DStudio.exe" "out/${{ matrix.asset }}" ;;
            macos)   ( cd dist && zip -r "../out/${{ matrix.asset }}" "Analogue3DStudio.app" ) ;;
            linux)   cp "dist/Analogue3DStudio" "out/${{ matrix.asset }}" ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset }}
