name: release

# Builds standalone binaries with PyInstaller and attaches them to the GitHub
# Release whenever a version tag (vX.Y.Z) is pushed. Can also be run manually
# (workflow_dispatch) to produce build artifacts without releasing.
#
# Windows (Edge WebView2) and macOS (Cocoa/WebKit) are built. Linux is NOT built:
# pywebview's GTK/WebKit backend doesn't bundle into a portable one-file binary
# reliably, so Linux users run from source (see the README). fail-fast is off so
# one OS failing doesn't block the other's upload.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            asset: Analogue3DDesktop-windows.exe
          - os: macos-latest
            label: macos
            asset: Analogue3DDesktop-macos.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps + engine
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "git+https://github.com/auntiepickle/Analogue3DUtility.git"
          if [ "${{ matrix.label }}" = "windows" ]; then pip install pywebview pythonnet; fi
          if [ "${{ matrix.label }}" = "macos" ]; then pip install pywebview; fi

      - name: Build one-file binary
        run: python build.py

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.label }}" = "windows" ]; then
            cp "dist/Analogue3DDesktop.exe" "out/${{ matrix.asset }}"
          else
            ( cd dist && zip -r "../out/${{ matrix.asset }}" "Analogue3DDesktop.app" )
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset }}
