name: release

# Builds standalone binaries with PyInstaller and attaches them to the GitHub
# Release whenever a version tag (vX.Y.Z) is pushed. Can also be run manually
# (workflow_dispatch) to produce build artifacts without releasing.
#
# Windows (Edge WebView2): a single .exe.
# macOS   (Cocoa/WebKit):  a proper .app, shipped two ways -
#     Analogue3DDesktop-macos.dmg  drag-to-Applications installer (for humans)
#     Analogue3DDesktop-macos.zip  the zipped .app (what the in-app updater grabs)
# Linux is NOT built (pywebview's GTK/WebKit doesn't bundle reliably; run from
# source - see the README). fail-fast is off so one OS failing doesn't block the
# other's upload.
#
# macOS signing:
#   By default the .app is ad-hoc signed (free) so it launches without the "is
#   damaged" error; browser downloads still show a one-time Gatekeeper prompt
#   (right-click -> Open) until the app is notarized.
#   To switch to Developer ID signing + Apple notarization (zero-friction), add
#   these repo secrets - the steps below activate automatically when
#   APPLE_DEV_ID_CERT_P12 is present, and are skipped otherwise:
#     APPLE_DEV_ID_CERT_P12       base64 of your Developer ID Application .p12
#     APPLE_DEV_ID_CERT_PASSWORD  password for that .p12
#     APPLE_TEAM_ID               your 10-char Apple Developer Team ID
#     APPLE_NOTARY_APPLE_ID       Apple ID email for notarytool
#     APPLE_NOTARY_PASSWORD       app-specific password for that Apple ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    env:
      # Surfaced so the signing/notarization steps can gate on `env.X != ''`
      # (secrets can't be referenced directly in step `if:` conditions).
      APPLE_DEV_ID_CERT_P12: ${{ secrets.APPLE_DEV_ID_CERT_P12 }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps + engine
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.20.0 "git+https://github.com/auntiepickle/Analogue3DUtility.git@fadf38c64b2478450eaef77c2574b226df546752"
          # Pin the Windows runtime trio to the combination verified for the netfx
          # fix (app.py). clr-loader is the runtime selector and must be pinned, or
          # an unpinned upgrade could re-break the launch on end-user machines.
          if [ "${{ matrix.label }}" = "windows" ]; then pip install pywebview==6.2.1 pythonnet==3.1.0 clr-loader==0.3.1; fi
          if [ "${{ matrix.label }}" = "macos" ]; then pip install pywebview==6.2.1; fi

      - name: Build
        run: python build.py

      - name: Stage artifact (Windows)
        if: matrix.label == 'windows'
        shell: bash
        run: |
          mkdir -p out
          cp "dist/Analogue3DDesktop.exe" "out/Analogue3DDesktop-windows.exe"

      - name: Code sign (Windows, Azure Trusted Signing)
        # Authenticode-sign the released .exe so it passes Windows SmartScreen and
        # Smart App Control. Opt-in: runs only when the Azure secrets are present
        # (same pattern as the macOS signing above). Required repo secrets:
        #   AZURE_TENANT_ID              Entra (Azure AD) tenant ID
        #   AZURE_CLIENT_ID              service-principal (app) ID
        #   AZURE_CLIENT_SECRET          service-principal client secret
        #   AZURE_CODE_SIGNING_ENDPOINT  region endpoint, e.g. https://eus.codesigning.azure.net/
        #   AZURE_CODE_SIGNING_ACCOUNT   Trusted Signing account name
        #   AZURE_CERT_PROFILE           certificate profile name
        # The service principal needs the "Trusted Signing Certificate Profile
        # Signer" role on the account. NOTE: this satisfies consumer SmartScreen /
        # Smart App Control; a strict *enterprise WDAC allowlist* may still block an
        # unapproved signer (an org-policy matter, not fixable from here).
        if: matrix.label == 'windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Code sign (macOS)
        if: matrix.label == 'macos'
        env:
          CERT_P12: ${{ secrets.APPLE_DEV_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}
        run: |
          set -e
          APP="dist/Analogue3DDesktop.app"
          if [ -n "$CERT_P12" ]; then
            echo "Signing with Developer ID (hardened runtime)"
            KC="$RUNNER_TEMP/build.keychain"
            KCPW="$(openssl rand -base64 16)"
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" login.keychain
            IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | awk '{print $2}')
            if [ -z "$IDENTITY" ]; then
              echo "No 'Developer ID Application' identity found - check APPLE_DEV_ID_CERT_P12 / APPLE_DEV_ID_CERT_PASSWORD." >&2
              exit 1
            fi
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          else
            echo "Ad-hoc signing (no Developer ID secret set)"
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP" || true

      - name: Package (macOS)
        if: matrix.label == 'macos'
        run: |
          set -e
          mkdir -p out dmgsrc
          cp -R "dist/Analogue3DDesktop.app" "dmgsrc/"
          # .zip for the in-app updater (ditto preserves perms/symlinks the way a
          # plain zip can drop them, keeping the swapped-in .app launchable).
          ditto -c -k --sequesterRsrc --keepParent "dist/Analogue3DDesktop.app" "out/Analogue3DDesktop-macos.zip"
          # .dmg with an Applications drop-target for drag-install (create-dmg if
          # available, else a plain hdiutil dmg).
          brew install create-dmg || true
          create-dmg \
            --volname "Analogue 3D Desktop" \
            --window-size 600 360 \
            --icon "Analogue3DDesktop.app" 150 180 \
            --app-drop-link 450 180 \
            "out/Analogue3DDesktop-macos.dmg" "dmgsrc/" \
          || hdiutil create -volname "Analogue 3D Desktop" -srcfolder "dmgsrc/" -ov -format UDZO "out/Analogue3DDesktop-macos.dmg"

      - name: Notarize (macOS, only when Developer ID secrets are set)
        if: matrix.label == 'macos' && env.APPLE_DEV_ID_CERT_P12 != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          xcrun notarytool submit "out/Analogue3DDesktop-macos.dmg" \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "out/Analogue3DDesktop-macos.dmg"
          # staple the .app too and re-zip so the updater ships a notarized bundle
          xcrun stapler staple "dist/Analogue3DDesktop.app"
          rm -f "out/Analogue3DDesktop-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Analogue3DDesktop.app" "out/Analogue3DDesktop-macos.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/*

      # Use the annotated tag's message as the release body, so the in-app
      # updater (which renders the release body as its notes) never shows an
      # empty "Update to vX?" dialog. Falls back to the tag name for a
      # lightweight tag. Deterministic across both matrix jobs (same text).
      - name: Release notes from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        run: |
          # The tag-triggered checkout is shallow and may have only the commit,
          # not the annotated tag object — re-fetch the tag so its message is
          # actually available to read.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          NOTES="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            NOTES="Release ${GITHUB_REF_NAME}"
          fi
          {
            echo "body<<__RELEASE_NOTES_EOF__"
            echo "$NOTES"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: ${{ steps.notes.outputs.body }}
